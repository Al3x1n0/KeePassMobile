name: app_security
description: >-
  Eventi di sistema per la sicurezza della sessione di KeePassMobile: schermo
  spento (Android) e dispositivo bloccato (iOS).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.al3x1n0.keepassmobile.app_security
        pluginClass: AppSecurityPlugin
      ios:
        pluginClass: AppSecurityPlugin

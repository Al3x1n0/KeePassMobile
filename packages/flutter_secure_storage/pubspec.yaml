name: flutter_secure_storage
description: >-
  Copia di flutter_secure_storage 11.2.0 (BSD-3-Clause) con due correzioni per
  KeePassMobile su Android: vedi KEEPASSMOBILE.md.
version: 11.2.0+kpm1
publish_to: none
repository: https://github.com/mogol/flutter_secure_storage/tree/develop/flutter_secure_storage

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.it_nomads.fluttersecurestorage
        pluginClass: FlutterSecureStoragePlugin
      ios:
        default_package: flutter_secure_storage_darwin
      macos:
        default_package: flutter_secure_storage_darwin
      linux:
        default_package: flutter_secure_storage_linux
      web:
        default_package: flutter_secure_storage_web
      windows:
        default_package: flutter_secure_storage_windows

# Come l'originale 11.2.0.
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_darwin: ^0.4.0
  flutter_secure_storage_linux: '>=3.0.1 <5.0.0'
  flutter_secure_storage_platform_interface: ^2.1.0
  flutter_secure_storage_web: ^2.1.1
  flutter_secure_storage_windows: ^4.2.2
  meta: ^1.16.0

name: document_access
description: >-
  Accesso diretto ai documenti scelti dall'utente: Storage Access Framework con
  permesso persistente su Android, security-scoped bookmark su iOS. Lettura e
  scrittura nel file originale.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.al3x1n0.keepassmobile.document_access
        pluginClass: DocumentAccessPlugin
      ios:
        pluginClass: DocumentAccessPlugin

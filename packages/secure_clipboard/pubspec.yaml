name: secure_clipboard
description: >-
  Copia negli appunti per KeePassMobile: contenuto sensibile e pulizia
  affidata al sistema (allarme su Android, scadenza nativa su iOS).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.al3x1n0.keepassmobile.secure_clipboard
        pluginClass: SecureClipboardPlugin
      ios:
        pluginClass: SecureClipboardPlugin
